name: macOS build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build application
        run: bash Scripts/package_app.sh release
      - name: Run core checks
        run: FrameNest.app/Contents/MacOS/FrameNest --self-test
      - name: Run MCP protocol checks
        run: python3 Scripts/test_mcp.py
      - name: Verify app signature
        run: codesign --verify --deep --strict FrameNest.app
